# playlist-exclude-az-tr-ru.conf
#
# Channels whose #EXTINF line contains any of these patterns are left out
# of the generated playlist-az-tr-ru.m3u.
#
# Format: one pattern per line, matched case-insensitively as a substring.
# Lines starting with # are comments and are ignored.
#
# Used by .github/workflows/build-az-tr-ru-playlist.yml

# Geo-blocked streams
geo-blocked
geo blocked
geoblocked
geo-restricted
geo restricted
