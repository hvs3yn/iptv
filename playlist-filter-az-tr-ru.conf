# playlist-filter-az-tr-ru.conf
#
# Whitelist of source files (relative to streams/) included in the
# generated playlist-az-tr-ru.m3u, and the group-title assigned to their
# channels.
#
# 🇦🇿 Azerbaijan, 🇹🇷 Turkey, 🇷🇺 Russia
#
# Format: <filename>=<group-title>
# Lines starting with # are comments and are ignored.
#
# Used by .github/workflows/build-az-tr-ru-playlist.yml

# Azerbaijan
az.m3u=Azerbaijan

# Turkey
tr.m3u=Turkey
tr_gem.m3u=Turkey
tr_onetv.m3u=Turkey

# Russia
ru.m3u=Russia
ru_15plusmg.m3u=Russia
ru_bonustv.m3u=Russia
ru_catcast.m3u=Russia
ru_mylifeisgood.m3u=Russia
ru_ntv.m3u=Russia
ru_rt.m3u=Russia
ru_smotrim.m3u=Russia
ru_televizor24.m3u=Russia
ru_tvbricks.m3u=Russia
ru_tvteleport.m3u=Russia
ru_zabava.m3u=Russia
