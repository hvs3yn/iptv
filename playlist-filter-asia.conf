# playlist-filter-asia.conf
#
# Whitelist of source files (relative to streams/) included in the
# generated playlist-asia.m3u, and the group-title assigned to their
# channels.
#
# 🌏 Asia & Middle East: TR, IR, AE, SA, QA, JP, KR, CN, IN
#
# Format: <filename>=<group-title>
# Lines starting with # are comments and are ignored.
#
# Used by .github/workflows/build-regional-playlists.yml

# Turkey
tr.m3u=Turkey

# Iran
ir.m3u=Iran
ir_telewebion.m3u=Iran
ir_wnslive.m3u=Iran

# United Arab Emirates
ae.m3u=United Arab Emirates

# Saudi Arabia
sa.m3u=Saudi Arabia

# Qatar
qa.m3u=Qatar

# Japan
jp.m3u=Japan

# South Korea
kr.m3u=South Korea

# China
cn.m3u=China

# India
in.m3u=India
