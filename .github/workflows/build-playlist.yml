name: Build Playlist

on:
  workflow_dispatch:
  schedule:
    # Staggered 20 minutes after sync.yml to avoid racing it on the hour.
    - cron: '20 */6 * * *'

permissions:
  contents: write

# Shares the push-to-master queue with sync.yml and the sports build.
concurrency:
  group: push-master
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate playlist
        run: |
          echo "#EXTM3U" > playlist.m3u

          while IFS='=' read -r source group; do
            [[ -z "$source" || "$source" == \#* ]] && continue

            file="streams/$source"
            if [[ ! -f "$file" ]]; then
              echo "::error::Source file listed in playlist-filter.conf not found: $file"
              exit 1
            fi

            awk -v group="$group" -v excludeFile="playlist-exclude.conf" -v executeFile="playlist-execute.conf" '
              BEGIN {
                excludeCount = 0
                while ((getline line < excludeFile) > 0) {
                  gsub(/^[ \t]+|[ \t]+$/, "", line)
                  if (line == "" || line ~ /^#/) continue
                  excludeCount++
                  excludePatterns[excludeCount] = tolower(line)
                }
                close(excludeFile)
                while ((getline line < executeFile) > 0) {
                  gsub(/^[ \t]+|[ \t]+$/, "", line)
                  if (line == "" || line ~ /^#/) continue
                  excludeCount++
                  excludePatterns[excludeCount] = tolower(line)
                }
                close(executeFile)
              }
              /^#EXTINF/ {
                skip = 0
                lowerLine = tolower($0)
                for (i = 1; i <= excludeCount; i++) {
                  if (index(lowerLine, excludePatterns[i]) > 0) {
                    skip = 1
                    break
                  }
                }
                if (!skip) {
                  if ($0 ~ /group-title="[^"]*"/) {
                    gsub(/group-title="[^"]*"/, "group-title=\"" group "\"")
                  } else {
                    sub(/,/, " group-title=\"" group "\",")
                  }
                }
              }
              skip { next }
              !/^#EXTM3U/ { print }
            ' "$file" >> playlist.m3u

          done < playlist-filter.conf

      - name: Remove ungrouped channels
        run: |
          awk '
            /^#EXTM3U/ { print; next }
            /^#EXTINF/ {
              if (buffer != "" && keep) printf "%s", buffer
              buffer = $0 "\n"
              keep = ($0 ~ /group-title="[^"]+"/) ? 1 : 0
              next
            }
            { buffer = buffer $0 "\n" }
            END { if (buffer != "" && keep) printf "%s", buffer }
          ' playlist.m3u > playlist.m3u.tmp
          mv playlist.m3u.tmp playlist.m3u

      - name: Commit playlist
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update playlist"

          git pull --rebase origin master

          git push origin master