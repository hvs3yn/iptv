name: Build Playlist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate playlist
        run: |
          echo "#EXTM3U" > playlist.m3u

          while IFS='=' read -r source group; do
            # skip comments and blank lines
            [[ -z "$source" || "$source" == \#* ]] && continue

            file="streams/$source"
            if [[ ! -f "$file" ]]; then
              echo "::error::Source file listed in playlist-filter.conf not found: $file"
              exit 1
            fi

            # add/replace group-title on every #EXTINF line, then append
            # everything except the leading #EXTM3U header
            awk -v group="$group" '
              /^#EXTINF/ {
                if ($0 ~ /group-title="[^"]*"/) {
                  gsub(/group-title="[^"]*"/, "group-title=\"" group "\"")
                } else {
                  sub(/,/, " group-title=\"" group "\",")
                }
              }
              !/^#EXTM3U/ { print }
            ' "$file" >> playlist.m3u
          done < playlist-filter.conf

      - name: Commit playlist
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add playlist.m3u
          git commit -m "Update playlist" || echo "No changes"
          git push