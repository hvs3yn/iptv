name: Build Playlist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate playlist
        run: |
          echo "#EXTM3U" > playlist.m3u

          while IFS='=' read -r source group; do
            [[ -z "$source" || "$source" == \#* ]] && continue

            file="streams/$source"
            if [[ ! -f "$file" ]]; then
              echo "::error::Source file listed in playlist-filter.conf not found: $file"
              exit 1
            fi

            awk -v group="$group" -v excludeFile="playlist-exclude.conf" '
              BEGIN {
                excludeCount = 0
                while ((getline line < excludeFile) > 0) {
                  gsub(/^[ \t]+|[ \t]+$/, "", line)
                  if (line == "" || line ~ /^#/) continue
                  excludeCount++
                  excludePatterns[excludeCount] = tolower(line)
                }
                close(excludeFile)
              }
              /^#EXTINF/ {
                skip = 0
                lowerLine = tolower($0)
                for (i = 1; i <= excludeCount; i++) {
                  if (index(lowerLine, excludePatterns[i]) > 0) {
                    skip = 1
                    break
                  }
                }
                if (!skip) {
                  if ($0 ~ /group-title="[^"]*"/) {
                    gsub(/group-title="[^"]*"/, "group-title=\"" group "\"")
                  } else {
                    sub(/,/, " group-title=\"" group "\",")
                  }
                }
              }
              skip { next }
              !/^#EXTM3U/ { print }
            ' "$file" >> playlist.m3u

          done < playlist-filter.conf

      - name: Commit playlist
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add playlist.m3u

          git commit -m "Update playlist" || echo "No changes"

          git pull --rebase origin master

          git push origin master