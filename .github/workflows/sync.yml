name: Sync with upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/iptv-org/iptv.git || true
          git fetch upstream

      - name: Merge upstream
        run: |
          if git show-ref --verify --quiet refs/remotes/upstream/master; then
            UPSTREAM=upstream/master
          else
            UPSTREAM=upstream/main
          fi

          git merge "$UPSTREAM" -m "Sync with upstream" || true

      - name: Resolve conflicts by taking upstream version
        run: |
          if git diff --name-only --diff-filter=U | grep .; then
            git diff --name-only --diff-filter=U | while read file; do
              git checkout --theirs "$file"
              git add "$file"
            done
            git commit -m "Resolve merge conflicts using upstream version"
          else
            echo "No conflicts."
          fi

      - name: Push changes
        run: git push origin master