name: Sync with upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          if ! git remote | grep -q "^upstream$"; then
            git remote add upstream https://github.com/iptv-org/iptv.git
          fi
          git fetch upstream --prune

      - name: Merge upstream
        id: merge
        shell: bash
        run: |
          set -e

          if git show-ref --verify --quiet refs/remotes/upstream/master; then
            UPSTREAM="upstream/master"
          else
            UPSTREAM="upstream/main"
          fi

          echo "pre_merge_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          set +e
          git merge "$UPSTREAM" --no-edit
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "had_conflicts=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Merge failed."
              exit $STATUS
            fi
          else
            echo "had_conflicts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve conflicts using upstream
        if: steps.merge.outputs.had_conflicts == 'true'
        shell: bash
        run: |
          git diff --name-only --diff-filter=U | while read file; do
            git checkout --theirs "$file"
            git add "$file"
          done

          if ! git diff --cached --quiet; then
            git commit -m "Resolve merge conflicts using upstream version"
          fi

      - name: Restore fork-owned files
        shell: bash
        run: |
          PRE="${{ steps.merge.outputs.pre_merge_sha }}"

          PROTECTED=(
            ".github/workflows/sync.yml"
            ".github/workflows/build-playlist.yml"
            ".github/workflows/build-sports-playlist.yml"
            ".github/workflows/ai-review.yml"
            ".github/ai-review"
            ".github/docs/ai-review.md"
            "playlist-filter.conf"
            "playlist-exclude.conf"
            "playlist-execute.conf"
            "playlist.m3u"
            "playlist-sports.m3u"
          )

          RESTORED=false

          for file in "${PROTECTED[@]}"; do
            if git cat-file -e "$PRE:$file" 2>/dev/null; then
              if ! git diff --quiet "$PRE" HEAD -- "$file"; then
                echo "Restoring $file"
                git checkout "$PRE" -- "$file"
                git add "$file"
                RESTORED=true
              fi
            fi
          done

          if [ "$RESTORED" = true ]; then
            git commit -m "Restore fork-owned files"
          fi

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --cached --quiet && git diff --quiet HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git push origin HEAD:master