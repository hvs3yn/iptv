name: Sync with Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          if ! git remote | grep -q "^upstream$"; then
            git remote add upstream https://github.com/iptv-org/iptv.git
          fi

          git fetch upstream --prune

      - name: Detect upstream branch
        id: upstream
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/upstream/master; then
            echo "branch=master" >> $GITHUB_OUTPUT
          else
            echo "branch=main" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream
        shell: bash
        run: |
          set +e

          git merge "upstream/${{ steps.upstream.outputs.branch }}" \
            --no-edit \
            -X theirs

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "Resolving remaining conflicts..."

            git diff --name-only --diff-filter=U | while read file; do
              git checkout --theirs "$file"
              git add "$file"
            done

            git commit -m "Resolve upstream merge conflicts"
          fi

      - name: Restore fork files
        shell: bash
        run: |
          git restore \
            .github/workflows \
            .github/docs \
            playlist-filter.conf \
            playlist-exclude.conf \
            playlist-execute.conf \
            playlist.m3u \
            playlist-sports.m3u \
            || true

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Restore fork customizations"
          fi

      - name: Push changes
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH"

            if git push origin HEAD:"$BRANCH"; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Retry $i..."
            sleep 5
          done

          echo "::error::Failed to push after 3 attempts."
          exit 1