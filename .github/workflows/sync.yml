name: Sync with Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check sync token
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          if [ -z "$SYNC_TOKEN" ]; then
            echo "ERROR: SYNC_TOKEN secret is missing or empty."
            echo "Add SYNC_TOKEN under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "SYNC_TOKEN is available."

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        shell: bash
        run: |
          set -e

          if ! git remote | grep -q "^upstream$"; then
            git remote add upstream https://github.com/iptv-org/iptv.git
          fi

          git fetch upstream --prune
          git fetch origin "${GITHUB_REF_NAME}"

      - name: Detect upstream branch
        id: upstream
        shell: bash
        run: |
          set -e

          if git show-ref --verify --quiet refs/remotes/upstream/master; then
            echo "branch=master" >> "$GITHUB_OUTPUT"
          elif git show-ref --verify --quiet refs/remotes/upstream/main; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Could not find upstream master or main branch."
            exit 1
          fi

      - name: Merge upstream
        shell: bash
        run: |
          set -e

          UPSTREAM_BRANCH="${{ steps.upstream.outputs.branch }}"

          echo "Merging upstream/$UPSTREAM_BRANCH..."

          if git merge "upstream/$UPSTREAM_BRANCH" --no-edit -X theirs; then
            echo "Upstream merge completed successfully."
          else
            echo "Conflicts detected."
            echo "Resolving conflicts using upstream version..."

            git diff --name-only --diff-filter=U | while IFS= read -r file; do
              [ -z "$file" ] && continue

              echo "Resolving: $file"
              git checkout --theirs -- "$file"
              git add -- "$file"
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "ERROR: Unresolved merge conflicts remain."
              git merge --abort || true
              exit 1
            fi

            if ! git diff --cached --quiet; then
              git commit -m "Merge upstream/$UPSTREAM_BRANCH"
            fi
          fi

      - name: Restore fork customizations
        shell: bash
        run: |
          set -e

          CUSTOM_FILES=(
            ".github/workflows"
            ".github/docs"
            "playlist-filter.conf"
            "playlist-exclude.conf"
            "playlist-execute.conf"
            "playlist-filter-europe.conf"
            "playlist-filter-asia.conf"
            "playlist-filter-america.conf"
            "playlist.m3u"
            "playlist-sports.m3u"
            "playlist-europe.m3u"
            "playlist-asia.m3u"
            "playlist-america.m3u"
          )

          for file in "${CUSTOM_FILES[@]}"; do
            if git cat-file -e "origin/${GITHUB_REF_NAME}:${file}" 2>/dev/null; then
              echo "Restoring: $file"
              git restore --source="origin/${GITHUB_REF_NAME}" -- "$file"
            else
              echo "Skipping missing file: $file"
            fi
          done

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Restore fork customizations"
          else
            echo "No fork customizations changed."
          fi

      - name: Synchronize with remote
        shell: bash
        run: |
          set -e

          BRANCH="${GITHUB_REF_NAME}"

          git fetch origin "$BRANCH"

          if git merge "origin/$BRANCH" --no-edit; then
            echo "Remote synchronization completed."
          else
            echo "Conflicts detected with remote branch."
            echo "Resolving using remote version..."

            git diff --name-only --diff-filter=U | while IFS= read -r file; do
              [ -z "$file" ] && continue

              echo "Resolving: $file"
              git checkout --theirs -- "$file"
              git add -- "$file"
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "ERROR: Unresolved remote conflicts remain."
              git merge --abort || true
              exit 1
            fi

            if ! git diff --cached --quiet; then
              git commit -m "Resolve remote synchronization conflicts"
            fi
          fi

      - name: Push changes
        shell: bash
        run: |
          set -e

          BRANCH="${GITHUB_REF_NAME}"

          echo "Pushing to origin/$BRANCH..."

          git push origin "HEAD:$BRANCH"

          echo "======================================"
          echo "Upstream synchronization completed."
          echo "======================================"