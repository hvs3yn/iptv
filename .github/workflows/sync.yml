name: Sync with Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure Git authentication
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          if [ -z "$SYNC_TOKEN" ]; then
            echo "ERROR: SYNC_TOKEN is missing."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global credential.helper store

          printf "https://x-access-token:%s@github.com\n" "$SYNC_TOKEN" \
            > "$HOME/.git-credentials"

          chmod 600 "$HOME/.git-credentials"

      - name: Clone repository
        shell: bash
        run: |
          set -e

          git clone \
            --origin origin \
            https://github.com/hvs3yn/iptv.git \
            "$GITHUB_WORKSPACE"

          cd "$GITHUB_WORKSPACE"

          git fetch --all --tags --prune

          git checkout "$GITHUB_REF_NAME"

          git branch --set-upstream-to="origin/$GITHUB_REF_NAME" "$GITHUB_REF_NAME"

      - name: Add upstream
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          if git remote | grep -q "^upstream$"; then
            git remote set-url upstream https://github.com/iptv-org/iptv.git
          else
            git remote add upstream https://github.com/iptv-org/iptv.git
          fi

          git fetch upstream --prune

      - name: Detect upstream branch
        id: upstream
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          if git show-ref --verify --quiet refs/remotes/upstream/master; then
            echo "branch=master" >> "$GITHUB_OUTPUT"
            echo "Upstream branch: master"
          elif git show-ref --verify --quiet refs/remotes/upstream/main; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "Upstream branch: main"
          else
            echo "ERROR: upstream master/main branch not found."
            exit 1
          fi

      - name: Merge upstream
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          UPSTREAM_BRANCH="${{ steps.upstream.outputs.branch }}"

          echo "Merging upstream/$UPSTREAM_BRANCH..."

          if git merge "upstream/$UPSTREAM_BRANCH" --no-edit -X theirs; then
            echo "Upstream merged successfully."
          else
            echo "Conflicts detected."

            git diff --name-only --diff-filter=U | while IFS= read -r file; do
              [ -z "$file" ] && continue

              echo "Using upstream version: $file"

              git checkout --theirs -- "$file"
              git add -- "$file"
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "ERROR: Unresolved conflicts remain."
              git merge --abort || true
              exit 1
            fi

            if ! git diff --cached --quiet; then
              git commit -m "Merge upstream/$UPSTREAM_BRANCH"
            fi
          fi

      - name: Restore fork customizations
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          CUSTOM_FILES=(
            ".github/workflows"
            ".github/docs"
            "playlist-filter.conf"
            "playlist-exclude.conf"
            "playlist-execute.conf"
            "playlist-filter-europe.conf"
            "playlist-filter-asia.conf"
            "playlist-filter-america.conf"
            "playlist.m3u"
            "playlist-sports.m3u"
            "playlist-europe.m3u"
            "playlist-asia.m3u"
            "playlist-america.m3u"
          )

          for file in "${CUSTOM_FILES[@]}"; do
            if git cat-file -e "origin/${GITHUB_REF_NAME}:${file}" 2>/dev/null; then
              echo "Restoring fork version: $file"

              git restore \
                --source="origin/${GITHUB_REF_NAME}" \
                -- "$file"
            else
              echo "File does not exist in fork: $file"
            fi
          done

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Restore fork customizations"
          else
            echo "No fork customizations to restore."
          fi

      - name: Update from remote
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          BRANCH="${GITHUB_REF_NAME}"

          echo "Fetching latest origin/$BRANCH..."

          git fetch origin "$BRANCH"

          if git merge "origin/$BRANCH" --no-edit; then
            echo "Remote branch merged successfully."
          else
            echo "Remote conflicts detected."

            git diff --name-only --diff-filter=U | while IFS= read -r file; do
              [ -z "$file" ] && continue

              echo "Using remote version: $file"

              git checkout --theirs -- "$file"
              git add -- "$file"
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "ERROR: Unresolved remote conflicts remain."
              git merge --abort || true
              exit 1
            fi

            if ! git diff --cached --quiet; then
              git commit -m "Resolve remote synchronization conflicts"
            fi
          fi

      - name: Push changes
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          BRANCH="${GITHUB_REF_NAME}"

          echo "Pushing to origin/$BRANCH..."

          git push origin "HEAD:$BRANCH"

          echo "======================================"
          echo "SYNC COMPLETED SUCCESSFULLY"
          echo "======================================"