# playlist-filter-america.conf
#
# Whitelist of source files (relative to streams/) included in the
# generated playlist-america.m3u, and the group-title assigned to their
# channels.
#
# 🌎 America: US, CA, MX, BR, AR
#
# Format: <filename>=<group-title>
# Lines starting with # are comments and are ignored.
#
# Used by .github/workflows/build-regional-playlists.yml

# United States
us.m3u=United States

# Canada
ca.m3u=Canada

# Mexico
mx.m3u=Mexico

# Brazil
br.m3u=Brazil

# Argentina
ar.m3u=Argentina
