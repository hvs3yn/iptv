# playlist-exclude.conf
#
# Channels whose #EXTINF line contains any of these patterns are left out
# of the generated playlists.
#
# Format: one pattern per line, matched case-insensitively as a substring.
# Lines starting with # are comments and are ignored.
#
# Used by .github/workflows/build-playlist.yml,
# .github/workflows/build-regional-playlists.yml and
# .github/workflows/build-az-tr-ru-playlist.yml

# Geo-blocked streams
geo-blocked
geo blocked
geoblocked
geo-restricted
geo restricted
